[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logfmt-tool"
version = "0.1.0"
description = "Parse, filter, select, and summarize logfmt (key=value) structured logs — to JSON or back. Pure stdlib CLI + library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott", email = "amarel.taylor.s@gmail.com" }]
keywords = ["logfmt", "logs", "logging", "key-value", "parse", "json", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Amarel-Taylor-Scott/logfmt-tool"
Repository = "https://github.com/Amarel-Taylor-Scott/logfmt-tool"
Issues = "https://github.com/Amarel-Taylor-Scott/logfmt-tool/issues"

[project.scripts]
logfmt = "logfmt_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["logfmt_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
